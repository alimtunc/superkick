[package]
name = "superkick-api"
edition.workspace = true
version.workspace = true

[dependencies]
superkick-config = { path = "../superkick-config" }
superkick-core = { path = "../superkick-core" }
superkick-storage = { path = "../superkick-storage" }
superkick-runtime = { path = "../superkick-runtime" }
superkick-integrations = { path = "../superkick-integrations" }
axum.workspace = true
tokio.workspace = true
tokio-stream = "0.1"
async-stream = "0.3"
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
bytes = "1"
dotenvy = "0.15"
indexmap = { version = "2", features = ["serde"] }

[features]
# Exposes test-only helpers (e.g. router builders that wire isolated handler
# slices). Off by default — enabled automatically by integration tests in this
# crate so the public API surface stays minimal in production builds.
test-support = []

[dev-dependencies]
sqlx.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
superkick-api = { path = ".", features = ["test-support"] }
