[package]
name = "superkick-api"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
superkick-config = { path = "../superkick-config" }
superkick-core = { path = "../superkick-core" }
superkick-storage = { path = "../superkick-storage" }
superkick-runtime = { path = "../superkick-runtime" }
superkick-integrations = { path = "../superkick-integrations" }
axum.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
async-stream = "0.3"
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
bytes = "1"
dotenvy = "0.15"
indexmap = { version = "2", features = ["serde"] }
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }

[features]
# Exposes test-only helpers (e.g. router builders that wire isolated handler
# slices). Off by default — enabled automatically by integration tests in this
# crate so the public API surface stays minimal in production builds.
test-support = []
# Embeds the built dashboard assets from ui/dist/ into the binary and serves
# them as a SPA fallback. Requires `pnpm build` to have run first; release
# distribution builds (`just install`) enable this.
embedded-ui = ["dep:rust-embed", "dep:mime_guess"]

[dev-dependencies]
sqlx.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile.workspace = true
superkick-api = { path = ".", features = ["test-support"] }
