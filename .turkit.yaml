# Generated by /turkit-workflow:install, then adopted by /turkit-workflow:adopt-project — just (Rust workspace + pnpm React UI), base main, Linear MCP available
commands:
  check: just check
  lint: just lint
  fmt: just fmt
  test: pnpm --dir ui test:run
  build: just build
  react_review: pnpm --dir ui dlx react-doctor@latest . --diff --verbose
base_branch: main
workflow:
  workspace: worktree_required
  worktree_dir: .worktrees
  branch_template: "{ticket_id_lower}-{slug}"
  init:
    - cp examples/superkick.yaml superkick.yaml
    - cp ../../.env .env
    - pnpm --dir ui install
rules:
  docs:
    - CLAUDE.md
    - AGENTS.md
    - docs/conventions/rust.md
    - docs/conventions/frontend.md
    - docs/conventions/testing.md
    - docs/conventions/visual-design.md
    - docs/conventions/workflow.md
    - docs/conventions/ticket-format.md
